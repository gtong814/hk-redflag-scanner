name: Daily HKEX Red Flag Scan

on:
  schedule:
    # 每天香港時間 08:30 (UTC 00:30) 與 21:00 (UTC 13:00) 自動掃描
    - cron: '30 0 * * 1-5'
    - cron: '0 13 * * 1-5'
  workflow_dispatch: # 允許你在 GitHub 網頁隨時手動按「執行」

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: 下載專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行披露易爬蟲與 AI 紅旗掃描
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scanner.py

      - name: 將最新掃描結果存回 GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scan_results.json
          git commit -m "Auto update HKEX red flag scan" || exit 0
          git push
